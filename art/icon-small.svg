<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 100 100">
  <!-- MrDiff アイコン（16 / 32px 用の簡略版）。
       グリフは icon.svg と同じ丸 2 つの重なり（共通と違い）。
       gloss と落ち影は 16px では見えず階調がにじむだけなので外す。
       線を少し太くし、ずらし幅を広げて、16px でも重なりが残るようにしてある。
       本体の大きさは icon.svg と揃える（canvas の 80.47%。全面に描かない）。 -->
  <defs>
    <linearGradient id="coral" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF9A6B"/>
      <stop offset="1" stop-color="#B8321E"/>
    </linearGradient>
  </defs>
  <g transform="translate(9.765 9.765) scale(0.8047)">
    <rect width="100" height="100" rx="23" fill="url(#coral)"/>
    <g fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="40" cy="40" r="19"/>
      <circle cx="60" cy="60" r="19"/>
    </g>
  </g>
</svg>
